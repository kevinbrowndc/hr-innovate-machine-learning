name: GA4 prospective weekly pilot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Initialize once, run weekly, or verify SMTP without sending
        required: true
        type: choice
        options: [weekly, initialize, verify-email]
        default: weekly
  schedule:
    # 22:30 Cyprus: UTC+3 summer / UTC+2 winter. Python gates the inactive slot.
    - cron: '30 19,20 * * 0'

permissions:
  contents: read

concurrency:
  group: ga4-prospective-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: github.ref == 'refs/heads/main' && (vars.PILOT_ENABLED == 'true' || inputs.mode == 'verify-email')
    environment: ga4-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
      GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
      FORECAST_ARCHIVE_REPO: ${{ vars.FORECAST_ARCHIVE_REPO }}
      FORECAST_ARCHIVE_TOKEN: ${{ secrets.FORECAST_ARCHIVE_TOKEN }}
      PILOT_ID: ${{ vars.PILOT_ID }}
      PILOT_START_DATE: ${{ vars.PILOT_START_DATE }}
      EMAIL_DELIVERY_ENABLED: ${{ vars.EMAIL_DELIVERY_ENABLED }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      PILOT_MODE: ${{ inputs.mode || 'weekly' }}
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/01_ga4_traffic_forecasting/requirements-pilot.txt
      - name: Install frozen pilot environment
        run: pip install -r projects/01_ga4_traffic_forecasting/requirements-pilot.txt
      - name: Persist forecast, validate genuine records, and gate test email
        run: python projects/01_ga4_traffic_forecasting/src/weekly_pilot.py "$PILOT_MODE"
      # No public artifacts, raw exports, model files, charts or message bodies uploaded.
