name: GA4 Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ga4:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GA4 client
        run: pip install -r projects/01_ga4_traffic_forecasting/requirements-pilot.txt
      - name: Verify finalized Cyprus daily data without logging sessions
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "projects/01_ga4_traffic_forecasting/src")
          from weekly_pilot import fetch_daily, finalized_through, utcnow
          try:
              day = finalized_through(utcnow())
              fetch_daily(day, day)
          except Exception:
              print("GA4 connection/data-quality check failed; no private details logged")
              raise SystemExit(1)
          print("GA4 connection, Cyprus timezone and finalized-day coverage verified")
          PY
