name: GA4 Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ga4:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GA4 client
        run: pip install google-analytics-data
      - name: Fetch yesterday's sessions
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          from google.analytics.data_v1beta import BetaAnalyticsDataClient
          from google.analytics.data_v1beta.types import RunReportRequest, DateRange, Metric
          from google.oauth2 import service_account

          info = json.loads(os.environ["GA4_CREDENTIALS_JSON"])
          if info.get("type") != "service_account":
              raise ValueError("GA4_CREDENTIALS_JSON must contain service-account credentials")
          creds = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/analytics.readonly"]
          )
          client = BetaAnalyticsDataClient(credentials=creds)
          response = client.run_report(RunReportRequest(
              property="properties/" + os.environ["GA4_PROPERTY_ID"],
              date_ranges=[DateRange(start_date="yesterday", end_date="yesterday")],
              metrics=[Metric(name="sessions")],
          ))
          sessions = response.rows[0].metric_values[0].value if response.rows else "0"
          print("GA4 yesterday sessions:", sessions)
          PY
